<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monitoring Tim Desain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#152744;
    --navy-2:#1d3660;
    --bg:#f4f6f9;
    --card:#ffffff;
    --border:#e6eaf0;
    --text:#0f1b2e;
    --muted:#64748b;
    --blue:#3b7bf0;
    --orange:#f2914d;
    --green:#1fb37a;
    --green-bg:#e4f8ef;
    --orange-bg:#fdece0;
    --gray-bg:#eef1f5;
    --red:#e0525f;
    --red-bg:#fbe6e8;
    --row-hover:#f8fafc;
    --detail-bg:#fafbfd;
  }

  [data-theme="dark"] {
    --navy:#0d1829;
    --navy-2:#13223d;
    --bg:#0b0f17;
    --card:#151c28;
    --border:#263347;
    --text:#f0f4f8;
    --muted:#8e9bb0;
    --gray-bg:#1d2636;
    --green-bg:rgba(31,179,122,0.15);
    --orange-bg:rgba(242,145,77,0.15);
    --red-bg:rgba(224,82,95,0.15);
    --row-hover:#1a2332;
    --detail-bg:#0f1522;
  }

  *{box-sizing:border-box;}
  html, body {
    margin:0;
    padding:0;
    width:100%;
    overflow-x:hidden;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    transition: background-color 0.2s ease, color 0.2s ease;
  }

  .header{
    background:linear-gradient(135deg,var(--navy),var(--navy-2));
    color:#fff;
    padding:32px 24px 60px;
  }
  .header-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    flex-wrap:wrap;
    gap:16px;
  }
  .header h1{font-size:28px;font-weight:800;margin:0;}
  .header p{margin:6px 0 0;color:#c3d0e6;font-size:14px;}
  .sync-block{text-align:right;}
  .sync-time{font-size:12.5px;color:#b7c6de;margin-bottom:10px;}
  .action-btns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;}
  
  .refresh-btn, .print-btn, .export-btn, .theme-btn{
    background:#fff;color:var(--navy);border:none;padding:10px 14px;border-radius:8px;
    font-weight:600;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
    box-shadow:0 4px 14px rgba(0,0,0,.15);transition:.15s;
  }
  [data-theme="dark"] .refresh-btn, 
  [data-theme="dark"] .print-btn, 
  [data-theme="dark"] .export-btn, 
  [data-theme="dark"] .theme-btn {
    background:var(--card);
    color:var(--text);
    border:1px solid var(--border);
  }

  .refresh-btn:hover, .print-btn:hover, .export-btn:hover, .theme-btn:hover{transform:translateY(-1px);}
  .refresh-btn svg, .print-btn svg, .export-btn svg{width:14px;height:14px;}

  .wrap{max-width:1180px;margin:0 auto;padding:0 20px;}
  .kpi-row{
    display:grid;grid-template-columns:repeat(3,1fr);gap:18px;
    margin-top:-38px;margin-bottom:24px;
  }
  .kpi{
    background:var(--card);border-radius:12px;padding:20px 22px;
    box-shadow:0 8px 24px rgba(0,0,0,.08);border-left:4px solid var(--kpi-c,var(--blue));
  }
  .kpi-label{font-size:13px;color:var(--muted);font-weight:500;}
  .kpi-value{font-size:30px;font-weight:800;margin-top:4px;}
  .kpi-sub{font-size:12.5px;color:var(--muted);margin-top:4px;}

  .main-grid{display:grid;grid-template-columns:320px 1fr;gap:20px;margin-bottom:40px;align-items:start;}

  .card{background:var(--card);border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.06);padding:22px;overflow:hidden;}
  .card-title{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700;}
  .live-badge{background:var(--green-bg);color:var(--green);font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:20px;letter-spacing:.03em;}
  .card-sub{font-size:12.5px;color:var(--muted);margin:4px 0 16px;}

  .controls-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }
  .filter-container {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .filter-btn {
    background: var(--gray-bg);
    border: 1px solid transparent;
    color: var(--muted);
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    transition: all .15s ease;
  }
  .filter-btn:hover { background: var(--border); color: var(--text); }
  .filter-btn.active { background: var(--blue); color: #ffffff; border-color: var(--blue); }

  .search-pic-group {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    width: 100%;
    max-width: 400px;
  }
  .search-input, .pic-select {
    padding: 7px 12px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    border-radius: 8px;
    font-size: 12.5px;
    outline: none;
    font-family: inherit;
    flex: 1;
  }
  .search-input:focus, .pic-select:focus { border-color: var(--blue); }

  .donut-wrap{display:flex;flex-direction:column;align-items:center;gap:18px;}
  .donut{width:170px;height:170px;border-radius:50%;position:relative;}
  .donut-hole{position:absolute;inset:26px;background:var(--card);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;}
  .donut-hole b{font-size:22px;}
  .donut-hole span{font-size:11px;color:var(--muted);}
  .legend{width:100%;display:flex;flex-direction:column;gap:4px;}
  .legend-row{display:flex;align-items:center;justify-content:space-between;font-size:13px;cursor:pointer;padding:4px 0;}
  .legend-left{display:flex;align-items:center;gap:8px;}
  .legend-dot{width:9px;height:9px;border-radius:50%;}
  .legend-num{font-weight:700;font-size:13px;}
  .legend-pct{color:var(--muted);font-size:12px;margin-left:6px;}
  .legend-chevron{font-size:9px;color:var(--muted);transition:transform .15s;margin-left:6px;}
  .legend-chevron.open{transform:rotate(90deg);}
  .status-list{
    list-style:none;margin:0 0 6px;padding:6px 0 6px 17px;display:none;
    border-left:2px solid var(--border);margin-left:4px;
  }
  .status-list.open{display:block;}
  .status-list li{
    font-size:12px;color:var(--text);padding:4px 0;display:flex;justify-content:space-between;gap:8px;
  }
  .status-list li span:first-child{color:var(--muted);}
  .status-list .item-progress{font-weight:600;flex-shrink:0;}

  /* Wrapper Scroll Tabel untuk HP */
  .table-responsive {
    width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }

  table{width:100%;border-collapse:collapse;min-width: 600px;}
  th{
    text-align:left;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;
    padding:0 10px 10px;font-weight:600;border-bottom:1px solid var(--border);
  }
  td{padding:14px 10px;border-bottom:1px solid var(--border);vertical-align:middle;font-size:13.5px;}
  tr.item-row{cursor:pointer;transition:.1s;}
  tr.item-row:hover{background:var(--row-hover);}
  .proj-name{font-weight:700;}
  .fase-name{display:flex;align-items:center;gap:6px;}
  .chevron{display:inline-block;transition:transform .15s;color:var(--muted);font-size:11px;}
  .chevron.open{transform:rotate(90deg);}
  .progress-bar{width:80px;height:7px;background:var(--gray-bg);border-radius:10px;overflow:hidden;display:inline-block;vertical-align:middle;margin-right:8px;}
  .progress-fill{height:100%;border-radius:10px;}
  .badge{font-size:11px;font-weight:700;padding:4px 11px;border-radius:20px;white-space:nowrap;}

  .days-tag {
    display: block;
    font-size: 11px;
    font-weight: 600;
    margin-top: 3px;
  }
  .days-tag.urgent { color: var(--red); }
  .days-tag.warning { color: var(--orange); }
  .days-tag.normal { color: var(--muted); }
  .days-tag.done { color: var(--green); }

  .detail-row td{background:var(--detail-bg);padding:0;border-bottom:1px solid var(--border);}
  .detail-inner{padding:18px 20px 22px 20px;display:grid;grid-template-columns:1fr 1fr;gap:24px;}
  .detail-col-label{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700;margin-bottom:10px;}
  .doc-link{
    display:inline-flex;align-items:center;gap:6px;color:var(--blue);font-weight:600;font-size:13px;text-decoration:none;
  }
  .doc-link:hover{text-decoration:underline;}
  
  .note-box {
    margin-top: 10px;
    padding: 14px 16px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 12.5px;
    color: var(--text);
    line-height: 1.6;
  }
  .note-title {
    font-weight: 700;
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .note-section-heading { font-weight: 700; color: var(--blue); margin: 12px 0 6px 0; font-size: 13px; }
  .note-subheading { font-weight: 600; color: var(--muted); margin: 8px 0 4px 0; font-size: 12px; }
  .note-list { margin: 0 0 10px 0; padding-left: 18px; }
  .note-list li { margin-bottom: 4px; }
  
  /* Style khusus untuk link aktif di dalam Notes */
  .note-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    color: var(--blue);
    font-weight: 600;
    text-decoration: none;
    background: var(--gray-bg);
    padding: 3px 8px;
    border-radius: 6px;
    margin: 2px 0;
    word-break: break-all;
  }
  .note-link:hover { text-decoration: underline; }

  .pic-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;}
  .pic-name{font-weight:700;font-size:14px;}
  .pic-role{font-size:12px;color:var(--muted);margin-bottom:12px;}
  .pic-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .pic-btn{
    display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;
    padding:7px 12px;border-radius:20px;text-decoration:none;border:none;cursor:pointer;
  }
  .pic-btn.wa{background:var(--green-bg);color:var(--green);}
  .pic-btn.phone{background:var(--gray-bg);color:var(--text);}
  .no-data{color:var(--muted);font-size:12.5px;font-style:italic;}

  .loading,.error{text-align:center;padding:70px 20px;color:var(--muted);font-size:13.5px;}
  .error{color:var(--red);}
  .error button{
    margin-top:14px;background:var(--card);border:1px solid var(--red);color:var(--red);
    padding:8px 16px;border-radius:8px;cursor:pointer;font-weight:600;
  }

  .footer {
    text-align: center;
    padding: 24px 0 32px;
    color: var(--muted);
    font-size: 13px;
    border-top: 1px solid var(--border);
    margin-top: 20px;
  }

  @media (max-width: 850px) {
    .header { padding: 24px 16px 50px; }
    .wrap { padding: 0 16px; }
    .header-top { flex-direction: column; align-items: stretch; gap: 14px; }
    .sync-block { text-align: left; }
    .action-btns { justify-content: flex-start; }
    .refresh-btn, .print-btn, .export-btn, .theme-btn { flex: 1 1 calc(50% - 6px); justify-content: center; }
    
    .kpi-row { grid-template-columns: 1fr; margin-top: -30px; }
    .main-grid { grid-template-columns: 1fr; gap: 16px; }
    .detail-inner { grid-template-columns: 1fr; gap: 16px; }
    .controls-row { flex-direction: column; align-items: stretch; }
    .search-pic-group { max-width: 100%; }
  }

  @media print {
    .refresh-btn, .print-btn, .export-btn, .theme-btn, .filter-container, .search-pic-group, .sync-time { display: none !important; }
    .header { padding: 16px; background: var(--navy) !important; color: white !important; }
    .kpi-row { margin-top: 0; }
    .card { box-shadow: none; border: 1px solid #ccc; }
  }
</style>
</head>
<body>
  <div class="header">
    <div class="wrap header-top" style="padding:0;max-width:1180px;">
      <div>
        <h1>Monitoring Tim Desain</h1>
        <p>Dashboard</p>
      </div>
      <div class="sync-block">
        <div class="sync-time" id="syncTime">Menyinkronkan...</div>
        <div class="action-btns">
          <button class="theme-btn" id="themeToggleBtn" onclick="toggleTheme()">
            🌙 Dark Mode
          </button>
          <button class="export-btn" onclick="exportToCSV()">
            📥 Export CSV
          </button>
          <button class="print-btn" onclick="window.print()">
            🖨️ Cetak / PDF
          </button>
          <button class="refresh-btn" onclick="loadData()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 4v5h-5"/></svg>
            Refresh Data
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="wrap">
    <div class="kpi-row" id="kpiRow"></div>
    <div class="main-grid" id="mainGrid">
      <div class="card"><div class="loading">Memuat ringkasan status...</div></div>
      <div class="card"><div class="loading">Memuat daftar fase...</div></div>
    </div>
  </div>

  <footer class="footer">
    <div class="wrap">
      &copy; 2026 Monitoring Tim Desain. All rights reserved.
    </div>
  </footer>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxcXsHBi369pVFZ6TKFMq7X9JhL2ykfFG9xVXEJU9YyRNay89rchO1gsZ2xT-WRhboEDw/exec";

let globalRowsData = [];
let currentFilteredData = [];
let activeFilter = 'Semua';
let activeSearch = '';
let activePic = 'Semua';

function initTheme() {
  const savedTheme = localStorage.getItem('dashboard-theme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  updateThemeButton(savedTheme);
}

function toggleTheme() {
  const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
  const newTheme = currentTheme === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('dashboard-theme', newTheme);
  updateThemeButton(newTheme);
}

function updateThemeButton(theme) {
  const btn = document.getElementById('themeToggleBtn');
  if (btn) {
    btn.innerHTML = theme === 'dark' ? '☀️ Light Mode' : '🌙 Dark Mode';
  }
}

function parseDate(s){ if(!s) return null; const d=new Date(s); return isNaN(d)?null:d; }
function fmtDate(d){ return d ? d.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}) : '-'; }
function waLink(phone){
  if(!phone) return null;
  let p = String(phone).replace(/[^0-9]/g,'');
  if(p.startsWith('0')) p = '62'+p.slice(1);
  return `https://wa.me/${p}`;
}
function statusOf(progress,start,end,today){
  if(progress>=100) return {label:'Selesai', c:'var(--green)', bg:'var(--green-bg)'};
  if(end && end<today) return {label:'Terlambat', c:'var(--red)', bg:'var(--red-bg)'};
  if(start && start>today) return {label:'Belum Mulai', c:'var(--muted)', bg:'var(--gray-bg)'};
  return {label:'On Progress', c:'var(--orange)', bg:'var(--orange-bg)'};
}

function getDaysRemaining(end, progress, today) {
  if (progress >= 100) return { text: '✓ Selesai', class: 'done' };
  if (!end) return { text: '', class: '' };
  
  const diffTime = end - today;
  const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
  
  if (diffDays < 0) return { text: `⚠️ Terlewat ${Math.abs(diffDays)} hari`, class: 'urgent' };
  if (diffDays === 0) return { text: '⏰ Tenggat hari ini!', class: 'urgent' };
  if (diffDays <= 3) return { text: `⏳ Sisa ${diffDays} hari lagi`, class: 'warning' };
  return { text: `📅 Sisa ${diffDays} hari`, class: 'normal' };
}

// PARSER NOTES (SUDAH BISA DETEKSI & UBAH LINK MENJADI BISA DI-KLIK)
function parseNotesToHTML(text) {
  if (!text) return '';  
  
  let cleanText = text;

  // 1. Otomatis ubah URL Teks (http/https) menjadi Link / Button Aktif
  cleanText = cleanText.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener" class="note-link">🔗 Buka Link / File</a>');

  // 2. Format struktur bullet/section
  cleanText = cleanText.replace(/\n/g, ' ');
  cleanText = cleanText.replace(/(\[[^\]]+\])/g, '___SECTION___$1');
  cleanText = cleanText.replace(/\s*(Services|Products|Others):/gi, '___SUB___$1:');
  cleanText = cleanText.replace(/•/g, '___ITEM___');

  const parts = cleanText.split(/(?=___SECTION___|___SUB___|___ITEM___)/g);
  
  let htmlResult = '';
  let inList = false;

  parts.forEach(rawPart => {
    let part = rawPart.trim();
    if (!part) return;

    if (part.startsWith('___SECTION___')) {
      if (inList) { htmlResult += '</ul>'; inList = false; }
      const content = part.replace('___SECTION___', '').trim();
      htmlResult += `<div class="note-section-heading">${content}</div>`;
    } else if (part.startsWith('___SUB___')) {
      if (inList) { htmlResult += '</ul>'; inList = false; }
      const content = part.replace('___SUB___', '').trim();
      htmlResult += `<div class="note-subheading">${content}</div>`;
    } else if (part.startsWith('___ITEM___')) {
      if (!inList) { htmlResult += '<ul class="note-list">'; inList = true; }
      const content = part.replace('___ITEM___', '').trim();
      if (content) htmlResult += `<li>${content}</li>`;
    } else {
      if (inList) { htmlResult += '</ul>'; inList = false; }
      htmlResult += `<div>${part}</div>`;
    }
  });

  if (inList) htmlResult += '</ul>';
  return htmlResult;
}

async function loadData(){
  document.getElementById('mainGrid').innerHTML = `
    <div class="card"><div class="loading">Memuat ringkasan status...</div></div>
    <div class="card"><div class="loading">Memuat daftar fase...</div></div>`;
  try{
    const res = await fetch(API_URL);
    if(!res.ok) throw new Error('HTTP '+res.status);
    const raw = await res.json();
    if(!Array.isArray(raw) || raw.length===0){
      document.getElementById('mainGrid').innerHTML = '<div class="card">Belum ada data di sheet.</div>';
      document.getElementById('kpiRow').innerHTML='';
      return;
    }
    render(raw);
    document.getElementById('syncTime').textContent = 'Terakhir sinkron: ' + new Date().toLocaleTimeString('id-ID');
  }catch(err){
    document.getElementById('mainGrid').innerHTML = `
      <div class="card" style="grid-column:1/-1;">
        <div class="error">
          Gagal mengambil data: ${err.message}<br>
          Pastikan deployment Apps Script diset "Who has access: Anyone".
          <br><button onclick="loadData()">Coba Lagi</button>
        </div>
      </div>`;
  }
}

function render(raw){
  const today = new Date(); today.setHours(0,0,0,0);
  globalRowsData = raw.map((r,i)=>{
    const start = parseDate(r['Tanggal Mulai']);
    const end = parseDate(r['Tanggal Selesai']);
    const progress = Number(r['Progress Fase (%)'])||0;
    const stObj = statusOf(progress, start, end, today);
    return {
      id: i,
      project: r['Project'] || r['project'] || r['Proyek'] || 'Tanpa Nama',
      fase: r['Fase']||'-',
      pic: r['PIC']||'-',
      start: start,
      end: end,
      progress: progress,
      hp: r['PIC No HP']||'',
      link: r['Final File'] || r['final file'] || r['Link Final File'] || r['Link Referensi'] || '',
      notes: r['Notes'] || r['notes'] || r['Catatan'] || r['catatan'] || '',
      statusLabel: stObj.label
    };
  });

  currentFilteredData = [...globalRowsData];

  const projects = [...new Set(globalRowsData.map(r=>r.project))];
  const totalFase = globalRowsData.length;
  const selesai = globalRowsData.filter(r=>r.progress>=100).length;
  const onProgress = totalFase - selesai;

  const allPics = [...new Set(globalRowsData.flatMap(r=>r.pic.split(',').map(s=>s.trim())))].filter(Boolean);

  document.getElementById('kpiRow').innerHTML = `
    <div class="kpi" style="--kpi-c:var(--blue)">
      <div class="kpi-label">Jumlah project</div>
      <div class="kpi-value">${projects.length}</div>
      <div class="kpi-sub">project terdaftar</div>
    </div>
    <div class="kpi" style="--kpi-c:var(--orange)">
      <div class="kpi-label">Total Fase</div>
      <div class="kpi-value">${totalFase}</div>
      <div class="kpi-sub">${onProgress} sedang berjalan</div>
    </div>
    <div class="kpi" style="--kpi-c:var(--green)">
      <div class="kpi-label">Fase Selesai</div>
      <div class="kpi-value">${selesai}</div>
      <div class="kpi-sub">dari ${totalFase} item project</div>
    </div>`;

  const statusColor = {'Selesai':'#1fb37a','On Progress':'#f2914d','Belum Mulai':'#94a3b8','Terlambat':'#e0525f'};
  const statusItems = {'On Progress':[], 'Selesai':[], 'Terlambat':[], 'Belum Mulai':[]};
  globalRowsData.forEach(r=> statusItems[r.statusLabel].push(r));
  const order = ['On Progress','Selesai','Terlambat','Belum Mulai'];
  let acc = 0, gradientParts = [], legendRows = [];
  
  order.forEach(st=>{
    const items = statusItems[st];
    if(!items.length) return;
    const pct = (items.length/totalFase)*100;
    gradientParts.push(`${statusColor[st]} ${acc}% ${acc+pct}%`);
    acc += pct;
    legendRows.push({st,count:items.length,pct,items});
  });
  const donutGradient = `conic-gradient(${gradientParts.join(',')})`;
  const safeId = s => s.replace(/\s+/g,'-');

  const donutCard = `
    <div class="card">
      <div class="card-title">Distribusi Status Fase <span class="live-badge">LIVE</span></div>
      <div class="card-sub">Total fase dikelompokkan berdasarkan status &middot; klik untuk lihat daftarnya</div>
      <div class="donut-wrap">
        <div class="donut" style="background:${donutGradient}">
          <div class="donut-hole"><b>${totalFase}</b><span>total fase</span></div>
        </div>
        <div class="legend">
          ${legendRows.map(l=>`
            <div>
              <div class="legend-row" onclick="toggleStatusList('${safeId(l.st)}')">
                <div class="legend-left">
                  <div class="legend-dot" style="background:${statusColor[l.st]}"></div>
                  ${l.st}
                  <span class="legend-chevron" id="chev-status-${safeId(l.st)}">▶</span>
                </div>
                <div><span class="legend-num">${l.count}</span><span class="legend-pct">${l.pct.toFixed(1)}%</span></div>
              </div>
              <ul class="status-list" id="list-status-${safeId(l.st)}">
                ${[...new Set(l.items.map(it=>it.project))].map(project=>`
                  <li><span>${project}</span></li>`).join('')}
              </ul>
            </div>`).join('')}
        </div>
      </div>
    </div>`;

  const tableCard = `
    <div class="card">
      <div class="card-title">Daftar Fase</div>
      <div class="card-sub">Seluruh fase dari Google Sheets &middot; klik baris untuk detail</div>
      
      <div class="controls-row">
        <div class="filter-container">
          <button class="filter-btn active" onclick="filterStatus('Semua', this)">Semua (${totalFase})</button>
          <button class="filter-btn" onclick="filterStatus('On Progress', this)">On Progress (${statusItems['On Progress'].length})</button>
          <button class="filter-btn" onclick="filterStatus('Selesai', this)">Selesai (${statusItems['Selesai'].length})</button>
          <button class="filter-btn" onclick="filterStatus('Terlambat', this)">Terlambat (${statusItems['Terlambat'].length})</button>
          <button class="filter-btn" onclick="filterStatus('Belum Mulai', this)">Belum Mulai (${statusItems['Belum Mulai'].length})</button>
        </div>

        <div class="search-pic-group">
          <select class="pic-select" onchange="filterPic(this.value)">
            <option value="Semua">👤 Semua PIC</option>
            ${allPics.map(pic=>`<option value="${pic}">${pic}</option>`).join('')}
          </select>

          <input type="text" class="search-input" placeholder="🔍 Cari project / fase..." oninput="searchData(this.value)">
        </div>
      </div>

      <div class="table-responsive">
        <table>
          <thead><tr>
            <th>PROJECT</th><th>FASE</th><th>PIC</th><th>TANGGAL</th><th>PROGRESS</th><th>STATUS</th>
          </tr></thead>
          <tbody id="tableBody">
            ${renderTableRows(globalRowsData)}
          </tbody>
        </table>
      </div>
    </div>`;

  document.getElementById('mainGrid').innerHTML = donutCard + tableCard;
}

function renderTableRows(rows) {
  const today = new Date(); today.setHours(0,0,0,0);
  if(rows.length === 0) {
    return `<tr><td colspan="6" style="text-align:center;padding:30px;color:var(--muted);">Tidak ada fase yang sesuai dengan filter/pencarian.</td></tr>`;
  }
  return rows.map(p=>{
    const st = statusOf(p.progress, p.start, p.end, today);
    const dayInfo = getDaysRemaining(p.end, p.progress, today);
    const parsedNotes = parseNotesToHTML(p.notes);

    return `
      <tr class="item-row" onclick="toggleRow(${p.id})">
        <td class="proj-name">${p.project}</td>
        <td><div class="fase-name"><span class="chevron" id="chev-${p.id}">▶</span>${p.fase}</div></td>
        <td>${p.pic}</td>
        <td>
          ${fmtDate(p.start)} → ${fmtDate(p.end)}
          <span class="days-tag ${dayInfo.class}">${dayInfo.text}</span>
        </td>
        <td>
          <div class="progress-bar"><div class="progress-fill" style="width:${p.progress}%;background:${st.c}"></div></div>
          ${p.progress}%
        </td>
        <td><span class="badge" style="color:${st.c};background:${st.bg}">${st.label}</span></td>
      </tr>
      <tr class="detail-row" id="row-${p.id}" style="display:none;">
        <td colspan="6">
          <div class="detail-inner">
            <div>
              <div class="detail-col-label">Kontak PIC</div>
              <div class="pic-card">
                <div class="pic-name">${p.pic}</div>
                <div class="pic-role">Penanggung jawab fase</div>
                <div class="pic-actions">
                  ${p.hp ? `<a class="pic-btn wa" href="${waLink(p.hp)}" target="_blank" rel="noopener">💬 WhatsApp</a>
                            <a class="pic-btn phone" href="tel:${p.hp}">📞 ${p.hp}</a>`
                        : `<span class="no-data">Kontak belum diisi</span>`}
                </div>
              </div>
            </div>
            <div>
              <div class="detail-col-label">Dokumen Pendukung</div>
              <div>
                ${p.link ? `<a class="doc-link" href="${p.link}" target="_blank" rel="noopener">📄 Buka Link Final File</a>`
                         : `<span class="no-data">Belum ada link Final File</span>`}
              </div>
              ${p.notes ? `
                <div class="note-box">
                  <div class="note-title">📌 NOTES</div>
                  ${parsedNotes}
                </div>` : ''}
            </div>
          </div>
        </td>
      </tr>`;
  }).join('');
}

function applyCombinedFilters() {
  let filtered = globalRowsData;

  if (activeFilter !== 'Semua') {
    filtered = filtered.filter(r => r.statusLabel === activeFilter);
  }
  if (activePic !== 'Semua') {
    filtered = filtered.filter(r => r.pic.toLowerCase().includes(activePic.toLowerCase()));
  }
  if (activeSearch.trim() !== '') {
    const q = activeSearch.toLowerCase();
    filtered = filtered.filter(r => 
      r.project.toLowerCase().includes(q) || 
      r.fase.toLowerCase().includes(q) || 
      r.pic.toLowerCase().includes(q)
    );
  }

  currentFilteredData = filtered;
  document.getElementById('tableBody').innerHTML = renderTableRows(filtered);
}

function filterStatus(status, btnElement) {
  activeFilter = status;
  document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
  btnElement.classList.add('active');
  applyCombinedFilters();
}

function filterPic(picName) {
  activePic = picName;
  applyCombinedFilters();
}

function searchData(query) {
  activeSearch = query;
  applyCombinedFilters();
}

function exportToCSV() {
  if (!currentFilteredData || currentFilteredData.length === 0) {
    alert("Tidak ada data untuk diexport!");
    return;
  }

  const headers = ["Project", "Fase", "PIC", "PIC No HP", "Tanggal Mulai", "Tanggal Selesai", "Progress (%)", "Status", "Final File", "Notes"];
  
  const csvRows = currentFilteredData.map(r => {
    const safeText = text => `"${String(text || '').replace(/"/g, '""')}"`;
    return [
      safeText(r.project),
      safeText(r.fase),
      safeText(r.pic),
      safeText(r.hp),
      safeText(fmtDate(r.start)),
      safeText(fmtDate(r.end)),
      r.progress,
      safeText(r.statusLabel),
      safeText(r.link),
      safeText(r.notes)
    ].join(",");
  });

  const csvContent = "\uFEFF" + [headers.join(","), ...csvRows].join("\n");

  const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  const dateStr = new Date().toISOString().slice(0,10);
  
  link.setAttribute("href", url);
  link.setAttribute("download", `Monitoring_Tim_Desain_${dateStr}.csv`);
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

function toggleStatusList(id){
  const list = document.getElementById('list-status-'+id);
  const chev = document.getElementById('chev-status-'+id);
  const open = list.classList.contains('open');
  list.classList.toggle('open', !open);
  chev.classList.toggle('open', !open);
}

function toggleRow(id){
  const row = document.getElementById('row-'+id);
  const chev = document.getElementById('chev-'+id);
  const open = row.style.display !== 'none';
  row.style.display = open ? 'none' : 'table-row';
  chev.classList.toggle('open', !open);
}

initTheme();
loadData();
</script>
</body>
</html>
